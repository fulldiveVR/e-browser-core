<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wize Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      position: relative;
      background: #0b0f19;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: relative;
      z-index: 1;
    }
    .sidepanel-close {
      position: absolute;
      top: 7px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgb(47 49 54);
      background: rgb(39 41 44);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
      transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
    }
    .sidepanel-close:hover {
      background: #3b3b3b      ;
      border-color: rgb(47 49 54);
    }
    .sidepanel-close:active {
      transform: translateY(1px);
    }
    .sidepanel-close span {
      font-size: 24px;
      line-height: 1;
      font-weight: 400;
      pointer-events: none;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <button class="sidepanel-close" id="sidepanel-close" aria-label="Close chat panel">
    <span>×</span>
  </button>
  <iframe src="http://localhost:22003/chat?embed=true" allow="microphone; camera"></iframe>
  <script src="sidepanel.js" defer></script>
</body>
</html>
